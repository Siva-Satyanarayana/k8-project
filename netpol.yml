apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: allow-traffic-from-frontend

spec:

  podSelector:
    matchLabels:
      app: myapp

  policyTypes:
  - Ingress
  - Egress


  ingress:

  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx

      podSelector:
        matchLabels:
          app.kubernetes.io/component: controller

    ports:
    - protocol: TCP
      port: 80


  egress:

  - to:
    - podSelector:
        matchLabels:
          app: bankdb

    ports:
    - protocol: TCP
      port: 3306


  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system

      podSelector:
        matchLabels:
          k8s-app: kube-dns

    ports:
    - protocol: UDP
      port: 53
