---
apiVersion: apps/v1
kind : StatefulSet
metadata:
  name: mystatefulset
spec:
  serviceName: "mystatefulset-service"
  replicas: 1
  selector:
    matchLabels:
      app: mystatefulset
  template:
    metadata:
      labels:
        app: mystatefulset
    spec:
      containers:
      - name: mystatefulset-container
        image: polavarapusiva/k8project:dbimage
        ports:  
        - containerPort: 3306 
        
        #resource quota
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi" 
            cpu: "500m" 

        #volume mount
        volumeMounts:
        - name: mystatefulset-volume
          mountPath: /usr/share/nginx/html
  volumeClaimTemplates:
  - metadata:
      name: mystatefulset-volume
    spec:
      storageClassName: gp2
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 2Gi     

        # secret
        envFrom:
        - secretRef:
            name: mysecret        
